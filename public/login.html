<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Learn English</title>
<link rel="stylesheet" href="style.css">
<style>
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:min(420px,100%);background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--glass-line);border-radius:24px;padding:32px 28px;box-shadow:0 30px 70px -40px oklch(0.55 0.16 290/.4)}
  .card h1{font:600 22px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;margin:0 0 6px;color:var(--ink)}
  .card p{margin:0 0 20px;color:var(--ink-3);font-size:14px}
  .field{display:flex;gap:8px}
  .field input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass-solid);color:var(--ink);font-size:15px;outline:none}
  .field input:focus{border-color:var(--accent)}
  .btn{padding:12px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
  .btn[disabled]{opacity:.5;cursor:default}
  .otp{display:none;margin-top:14px}
  .otp.open{display:block}
  .otp .field input{letter-spacing:.35em;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
  .sep{display:flex;align-items:center;gap:12px;color:var(--ink-4);font-size:12px;margin:22px 0 14px}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--glass-line)}
  .social{display:grid;gap:10px}
  .social button{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:14px;background:var(--glass-solid);border:1px solid var(--glass-line);color:var(--ink);font-size:14px;font-weight:500}
  .social button:hover{background:var(--bg)}
  .social svg{width:18px;height:18px}
  .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--ink-2)}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .back{display:block;text-align:center;margin-top:18px;color:var(--ink-3);font-size:13px;text-decoration:none}
  .back:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="auth"><div class="card">
  <h1>登录 Learn English</h1>
  <p>输入邮箱，我们发一封带登录链接和验证码的邮件。第一次登录即自动注册，无需密码。</p>
  <form id="emailForm" class="field"><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><button class="btn" id="sendBtn">发送</button></form>
  <div class="otp" id="otp">
    <p style="margin:0 0 8px">邮件已发出。点邮件里的链接，或在这里输入 6 位验证码：</p>
    <form id="otpForm" class="field"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="······" autocomplete="one-time-code"><button class="btn" id="otpBtn">登录</button></form>
  </div>
  <div class="msg" id="msg"></div>
  <div class="sep" id="sep">或</div>
  <div class="social" id="social"></div>
  <a class="back" href="/">← 先不登录，直接练习</a>
</div></div>
<script src="login.js"></script>
</body>
</html>

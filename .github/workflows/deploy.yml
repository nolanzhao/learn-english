name: Deploy to Cloudflare
on:
  workflow_dispatch:   # 手动触发；需要仓库密钥 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build content (public/content is not committed)
        run: npm run content
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - name: Deploy Worker + assets
        run: npx wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
